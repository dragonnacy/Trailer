<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Video</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100vw;
            height: 100vh;

            /* Mantiene completa la imagen sin deformarla */
            object-fit: contain;

            display: block;
            background: #000;
        }

        /* Cuando el video entra realmente en pantalla completa */
        video:fullscreen {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }

        video::-webkit-media-controls {
            z-index: 10;
        }
    </style>
</head>

<body>

    <video
        id="video"
        autoplay
        muted
        playsinline
        controls
        preload="auto"
    >
        <source src="trailer.mp4" type="video/mp4">

        Tu navegador no puede reproducir este video.
    </video>

    <script>
        const video = document.getElementById("video");

        // Intentar iniciar automáticamente
        video.play().catch(() => {
            // Algunos navegadores pueden impedir el autoplay.
            // En ese caso aparecerán los controles para iniciar manualmente.
        });

        // Al tocar el video, activar/desactivar el sonido
        video.addEventListener("click", () => {
            if (video.muted) {
                video.muted = false;
            }
        });
    </script>

</body>
</html>
